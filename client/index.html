<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#080f0c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="كوره كده" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/manus-storage/kora-keda-app-icon_9f5a2e2f.png" />
    <title>كوره كده — ألعاب كرة القدم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;600;700;800&family=DM+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <button id="safari-skip-fallback" type="button" aria-label="تخطي شاشة التحميل" style="position:fixed;z-index:9999;left:50%;bottom:12%;transform:translateX(-50%);min-width:8rem;min-height:2.75rem;padding:.55rem 1.25rem;border:1px solid #d5a82f;border-radius:999px;background:#172015;color:#f6c33f;font:700 16px/1.2 sans-serif;direction:rtl;cursor:pointer;">تخطي</button>
    <script>
      (() => {
        const fallback = document.getElementById("safari-skip-fallback");
        window.addEventListener("kora-app-ready", () => { fallback.hidden = true; });
        fallback.addEventListener("click", () => { window.location.hash = "#hub"; window.location.reload(); });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
